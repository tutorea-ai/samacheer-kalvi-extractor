<h2 class="block_15" id="toc_id_146">இயல் மூன்று</h2>
	<h2 id="id_knnnnennnt_tkum" class="block_15">கண்ணெனத் தகும்</h2>
	<p class="block_3"> </p>
	<p class="block_5"><img src="images/image-58.png" alt="QR Code T M  S 8 9" class="calibre69"/></p>
	<p class="block_3"> </p>
	<p class="block_13"><img src="images/image-59.png" alt="படம், உலக உருண்டை நான்கு சோதனை குழாய்கள் பென்சில் அளிப்பான் பல்வேறு வண்ணங்களில் உள்ள நான்கு புத்தகங்கள் காம்பஸ் கவராயம் போன்றவை திறந்த புத்தகத்தின் மேல் உள்ளது போன்ற படம்" class="calibre70"/></p>
	<h3 class="block_19" id="toc_id_147">கற்றல் நோக்கங்கள்</h3>
	<p class="block_3"> </p>
	<p class="block_21"> கல்வியின் சிறப்பையும் பயனையும் உணர்தல் </p>
	<p class="block_3"> </p>
	<p class="block_21"> கல்விப்பணி ஆற்றிய பெருமக்களைப் பற்றி அறிதல் </p>
	<p class="block_3"> </p>
	<p class="block_21"> நூலகம் பற்றித் தெரிந்துகொள்ளுதல்</p>
	<p class="block_3"> </p>
	<p class="block_21"> நூலகம் செல்லும் பழக்கத்தை ஏற்படுத்திக்கொள்ளுதல்</p>
	<p class="block_3"> </p>
	<p class="block_23"> தமிழைப் பிழையின்றி எழுதும் திறன் பெறுதல்</p>
	<p class="block_1" id="calibre_pb_10"> </p>
